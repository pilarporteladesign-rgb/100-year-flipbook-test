<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>100-Year Flipbook</title>

  <link
    rel="stylesheet"
    href="./styles.css?v=7"
  >
</head>

<body>

  <main class="flipbook-app">

    <div class="desktop-book-layout">

      <!-- PREVIOUS -->

      <div class="desktop-control desktop-control--previous">
        <button
          id="previous-button"
          class="control-button"
          type="button"
          aria-label="Previous pages"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M15.5 5L8.5 12L15.5 19" />
          </svg>
        </button>
      </div>


      <!-- BOOK -->

      <div class="book-area">

        <div
          id="book-wrapper"
          class="book-wrapper cover-position"
        >

          <div
            id="flipbook"
            class="flipbook"
          >

            <div class="page hard">
              <img
                src="./assets/pages/page-01.jpg"
                alt="Front cover"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page">
              <img
                src="./assets/pages/page-02.jpg"
                alt="Page 2"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page">
              <img
                src="./assets/pages/page-03.jpg"
                alt="Page 3"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page">
              <img
                src="./assets/pages/page-04.jpg"
                alt="Page 4"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page">
              <img
                src="./assets/pages/page-05.jpg"
                alt="Page 5"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page">
              <img
                src="./assets/pages/page-06.jpg"
                alt="Page 6"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page">
              <img
                src="./assets/pages/page-07.jpg"
                alt="Page 7"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div class="page hard">
              <img
                src="./assets/pages/page-08.jpg"
                alt="Back cover"
                width="720"
                height="720"
                draggable="false"
              >
            </div>

          </div>

          <div
            class="book-interaction-blocker"
            aria-hidden="true"
          ></div>

        </div>

      </div>


      <!-- NEXT -->

      <div class="desktop-control desktop-control--next">
        <button
          id="next-button"
          class="control-button"
          type="button"
          aria-label="Next pages"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8.5 5L15.5 12L8.5 19" />
          </svg>
        </button>
      </div>

    </div>


    <!--
      Tablet / mobile positioning is handled
      by CSS using the same two buttons above.
    -->

    <p
      id="page-indicator"
      class="visually-hidden"
      aria-live="polite"
    >
      Cover
    </p>

    <p
      id="status"
      class="visually-hidden"
      aria-live="polite"
      aria-atomic="true"
    >
      Front cover
    </p>

  </main>


  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
  ></script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"
  ></script>

  <script src="./script.js?v=7"></script>

</body>
</html>
