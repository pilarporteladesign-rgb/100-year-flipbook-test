<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Gallagher 100-year interactive flipbook"
  >

  <title>Gallagher 100-Year Flipbook</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <main class="flipbook-app">
    <section
      class="flipbook"
      aria-label="Gallagher 100-year commemorative flipbook"
    >
      <div class="book-viewport">
        <div
          id="book-stage"
          class="book-stage"
          aria-live="polite"
        >
          <!--
            The visible pages and animated page
            are created by script.js.
          -->
        </div>
      </div>

      <div
        class="book-controls"
        aria-label="Flipbook navigation"
      >
        <button
          id="previous-button"
          class="control-button"
          type="button"
          aria-label="Previous pages"
          disabled
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
          >
            <path
              d="M15.5 5L8.5 12L15.5 19"
            />
          </svg>
        </button>

        <p
          id="page-indicator"
          class="page-indicator"
          aria-live="polite"
        >
          Cover
        </p>

        <button
          id="next-button"
          class="control-button"
          type="button"
          aria-label="Next pages"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
          >
            <path
              d="M8.5 5L15.5 12L8.5 19"
            />
          </svg>
        </button>
      </div>

      <p
        id="book-status"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
      >
        Front cover
      </p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
