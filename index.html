<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>100-Year Flipbook</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>

  <main class="flipbook-app">

    <div class="book-area">

      <div
        id="book-wrapper"
        class="book-wrapper cover-position"
      >

        <div
          id="flipbook"
          class="flipbook"
        >

          <div class="page hard">
            <img
              src="./assets/pages/page-01.jpg"
              alt="Front cover"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page">
            <img
              src="./assets/pages/page-02.jpg"
              alt="Page 2"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page">
            <img
              src="./assets/pages/page-03.jpg"
              alt="Page 3"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page">
            <img
              src="./assets/pages/page-04.jpg"
              alt="Page 4"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page">
            <img
              src="./assets/pages/page-05.jpg"
              alt="Page 5"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page">
            <img
              src="./assets/pages/page-06.jpg"
              alt="Page 6"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page">
            <img
              src="./assets/pages/page-07.jpg"
              alt="Page 7"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

          <div class="page hard">
            <img
              src="./assets/pages/page-08.jpg"
              alt="Back cover"
              width="720"
              height="720"
              draggable="false"
            >
          </div>

        </div>

        <!--
          Prevent direct grabbing/dragging of pages.
          Navigation is handled by our buttons.
        -->
        <div
          class="book-interaction-blocker"
          aria-hidden="true"
        ></div>

      </div>

    </div>


    <!-- CONTROLS -->

    <nav
      class="book-controls"
      aria-label="Flipbook navigation"
    >

      <button
        id="previous-button"
        class="control-button"
        type="button"
        aria-label="Previous pages"
        disabled
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M15.5 5L8.5 12L15.5 19" />
        </svg>
      </button>


      <p
        id="page-indicator"
        class="page-indicator"
        aria-live="polite"
      >
        Cover
      </p>


      <button
        id="next-button"
        class="control-button"
        type="button"
        aria-label="Next pages"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M8.5 5L15.5 12L8.5 19" />
        </svg>
      </button>

    </nav>


    <p
      id="status"
      class="visually-hidden"
      aria-live="polite"
      aria-atomic="true"
    >
      Front cover
    </p>

  </main>


  <!-- jQuery -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
  ></script>


  <!-- Turn.js v3 -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"
  ></script>


  <!-- Flipbook application -->

  <script src="./script.js"></script>

</body>
</html>
