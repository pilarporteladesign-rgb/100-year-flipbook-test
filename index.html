<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Gallagher 100-year interactive flipbook"
  >

  <title>Gallagher 100-Year Flipbook</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <main class="flipbook-app">
    <section
      class="flipbook-experience"
      aria-label="Gallagher 100-year commemorative flipbook"
    >
      <div
        id="book-frame"
        class="book-frame is-front-cover"
      >
        <div
          id="book-positioner"
          class="book-positioner"
        >
          <div
            id="flipbook"
            class="flipbook"
            aria-hidden="true"
          >
            <div
              class="flip-page hard-cover front-cover"
              data-page-number="1"
            >
              <img
                src="./assets/pages/page-01.jpg"
                alt=""
                width="720"
                height="720"
                draggable="false"
              >
            </div>

            <div
              class="flip-page interior-page"
              data-page-number="2"
            >
              <img
                src="./assets/pages/page-02.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>

            <div
              class="flip-page interior-page"
              data-page-number="3"
            >
              <img
                src="./assets/pages/page-03.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>

            <div
              class="flip-page interior-page"
              data-page-number="4"
            >
              <img
                src="./assets/pages/page-04.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>

            <div
              class="flip-page interior-page"
              data-page-number="5"
            >
              <img
                src="./assets/pages/page-05.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>

            <div
              class="flip-page interior-page"
              data-page-number="6"
            >
              <img
                src="./assets/pages/page-06.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>

            <div
              class="flip-page interior-page"
              data-page-number="7"
            >
              <img
                src="./assets/pages/page-07.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>

            <div
              class="flip-page hard-cover back-cover"
              data-page-number="8"
            >
              <img
                src="./assets/pages/page-08.jpg"
                alt=""
                width="720"
                height="720"
                loading="eager"
                draggable="false"
              >
            </div>
          </div>

          <div
            class="interaction-blocker"
            aria-hidden="true"
          ></div>
        </div>
      </div>

      <div
        class="book-controls"
        aria-label="Flipbook navigation"
      >
        <button
          id="previous-button"
          class="control-button"
          type="button"
          aria-label="View previous pages"
          disabled
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
          >
            <path
              d="M15.5 5L8.5 12L15.5 19"
            />
          </svg>
        </button>

        <p
          id="page-indicator"
          class="page-indicator"
          aria-live="polite"
        >
          Cover
        </p>

        <button
          id="next-button"
          class="control-button"
          type="button"
          aria-label="View next pages"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
          >
            <path
              d="M8.5 5L15.5 12L8.5 19"
            />
          </svg>
        </button>
      </div>

      <p
        id="book-status"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
      >
        Front cover
      </p>
    </section>
  </main>

  <!-- jQuery is required by Turn.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
  ></script>

  <!-- Turn.js page-turn engine -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"
  ></script>

  <!-- Our application controls -->
  <script src="./script.js"></script>
</body>
</html>
